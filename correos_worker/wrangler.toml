name            = "supratech-correos"
main            = "index.js"
compatibility_date = "2025-01-01"

[vars]
FROM_EMAIL = "ventas@supratech.work"
FROM_NAME  = "Supratech"

# ─────────────────────────────────────────────────────────────
# Variables de entorno — configurar en Cloudflare Dashboard
# Workers & Pages → supratech-correos → Settings → Variables and Secrets
#
# Variable        Descripción
# ─────────────────────────────────────────────────────────────
# WORKER_SECRET   Clave secreta compartida con Flask (CF_WORKER_SECRET en .env)
# RESEND_API_KEY  API key de Resend (https://resend.com/api-keys)
# FROM_EMAIL      Email remitente, ej: ventas@supratech.work
# FROM_NAME       Nombre de pantalla, ej: Supratech
#
# Antes del primer despliegue:
#   1. Crear cuenta en https://resend.com
#   2. Agregar y verificar el dominio supratech.work (Resend da los registros
#      DNS — agregarlos en la zona DNS de supratech.work en Cloudflare)
#   3. Generar una API key
#
# Para desplegar:
#   wrangler login
#   wrangler deploy
#
# URL del worker resultante (agregar a .env / Railway como CF_WORKER_URL):
#   https://supratech-correos.<tu-subdomain>.workers.dev
